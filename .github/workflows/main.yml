name: Android CI - build & release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'               # build on version tag pushes
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: 
      ANDROID_SDK_ROOT: $RUNNER_TEMP/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Android cmdline tools + SDK/NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-110-9123335_latest.zip" -o cmdline.zip
          unzip -q cmdline.zip -d cmdline-temp
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv cmdline-temp/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          rm -rf cmdline.zip cmdline-temp
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;33.0.2" "cmake;3.22.1" "ndk;28.0.3"
        shell: bash

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.3" >> $GITHUB_ENV

      - name: Cache Gradle & pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pnpm-store
          key: ${{ runner.os }}-gradle-pnpm-${{ hashFiles('**/gradle-wrapper.properties','**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-pnpm-

      - name: Make native scripts executable
        run: |
          chmod +x ./deps/build_proot.sh ./scripts/prepare_android_sandbox.sh || true

      - name: Run native build scripts (may be slow)
        run: |
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
        working-directory: ${{ github.workspace }}

      - name: Install Android project deps
        working-directory: src/android
        run: ./gradlew --no-daemon dependencies

      - name: Decode keystore (if provided)
        if: ${{secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $HOME/keystore.jks
          echo "RELEASE_STORE_FILE=$HOME/keystore.jks" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Create gradle.properties for signing (if keystore exists)
        if: ${{env.RELEASE_STORE_FILE != '' }}
        run: |
          cat > $HOME/.gradle/gradle.properties <<EOF
          RELEASE_STORE_FILE=${RELEASE_STORE_FILE}
          RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}
          RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}
          EOF

      - name: Assemble Release (or Debug fallback)
        working-directory: src/android
        run: |
          set -e
          if [ -f "$HOME/keystore.jks" ]; then
            ./gradlew :app:assembleRelease -Pandroid.injected.signing.store.file="$HOME/keystore.jks"
          else
            ./gradlew :app:assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minis-apks
          path: src/android/app/build/outputs/**/*.apk

      - name: Create release and attach APK (on tag or release event)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src/android/app/build/outputs/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
